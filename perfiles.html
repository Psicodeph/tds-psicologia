<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfiles Guardados — TDS Honduras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1565C0;--ink:#1a2340;--ink2:#3d4f6b;--muted:#6b7a99;--border:#d4dbe8;--bg:#eef1f7;--card:#fff;--input:#f4f6fb;--green:#2e7d32;--red:#b71c1c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Nunito','Segoe UI',Arial,sans-serif;font-size:20px;color:var(--ink);padding-bottom:60px;}

/* Auth CSS removed */

/* HEADER */
.header{background:#fff;padding:20px 32px 18px;border-bottom:2px solid var(--border);box-shadow:0 2px 10px rgba(21,101,192,.08);position:sticky;top:0;z-index:100;}
.header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.header-left{display:flex;align-items:center;gap:16px;}
.header-sub{font-size:13px;letter-spacing:2px;color:var(--blue);text-transform:uppercase;margin-bottom:4px;font-weight:700;}
.header h1{font-size:28px;font-weight:900;color:var(--ink);}
.btn-back{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-size:18px;font-weight:800;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:var(--card);color:var(--blue);font-family:inherit;text-decoration:none;transition:all .2s;}
.btn-back:hover{background:#e8f0fe;border-color:var(--blue);}
.btn-nuevo{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-size:18px;font-weight:800;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#1565C0,#1e88e5);color:#fff;font-family:inherit;text-decoration:none;}
.btn-nuevo:hover{opacity:.88;}

.container{max-width:1180px;margin:0 auto;padding:28px 20px 0;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;text-align:center;box-shadow:0 2px 8px rgba(21,101,192,.05);}
.stat-val{font-size:36px;font-weight:900;color:var(--blue);}
.stat-lbl{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px;}

/* SEARCH */
.search-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(21,101,192,.05);}
.search-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.search-input{flex:1;background:var(--input);border:1.5px solid var(--border);border-radius:10px;padding:14px 18px;font-size:20px;color:var(--ink);font-family:inherit;font-weight:600;outline:none;min-width:200px;}
.search-input:focus{border-color:var(--blue);background:#fff;}
.filter-select{background:var(--input);border:1.5px solid var(--border);border-radius:10px;padding:14px 18px;font-size:18px;color:var(--ink);font-family:inherit;font-weight:600;outline:none;cursor:pointer;}
.filter-select:focus{border-color:var(--blue);}
.results-count{font-size:15px;color:var(--muted);font-weight:600;margin-top:10px;}

/* TABLE */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow-x:auto;box-shadow:0 2px 8px rgba(21,101,192,.05);}
table{width:100%;border-collapse:collapse;font-size:20px;}
th{background:#f5f7fc;color:var(--muted);font-size:14px;letter-spacing:1px;text-transform:uppercase;font-weight:800;padding:16px 18px;text-align:left;border-bottom:1.5px solid var(--border);}
td{padding:16px 18px;border-bottom:1px solid #eef1f7;color:var(--ink2);font-weight:600;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8f9fc;}
.empty{text-align:center;padding:48px;color:var(--muted);font-size:20px;font-weight:600;}

/* NAME MENU */
.name-cell{position:relative;}
.name-btn{color:var(--blue);cursor:pointer;font-weight:800;font-size:20px;background:none;border:none;font-family:inherit;text-align:left;padding:0;display:inline-flex;align-items:center;gap:6px;}
.name-btn::after{content:'▾';font-size:13px;opacity:.6;}
.name-btn:hover{text-decoration:underline;}
.action-menu{position:absolute;top:110%;left:0;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:200;min-width:220px;display:none;}
.action-menu.open{display:block;}
.action-menu-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;font-size:18px;font-weight:700;border:none;background:transparent;cursor:pointer;border-radius:8px;font-family:inherit;color:var(--ink2);text-align:left;}
.action-menu-btn:hover{background:var(--input);}
.action-menu-btn.danger{color:var(--red);}
.action-menu-btn.danger:hover{background:#ffebee;}

/* SCORE BADGES */
.score{font-weight:800;}
.sc-green{color:#2e7d32;}
.sc-amber{color:#e65100;}
.sc-red{color:#b71c1c;}
.sc-grey{color:#aaa;}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:14px 28px;border-radius:12px;font-size:18px;font-weight:700;z-index:9999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}

@media(max-width:700px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .header h1{font-size:22px;}
}
</style>
</head>

<script>
const{createClient}=supabase;
const sb=createClient(
  'https://esbmtenfcjbrrocrnfep.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzYm10ZW5mY2picnJvY3JuZmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTIxNjcsImV4cCI6MjA5NjA4ODE2N30.9N-xdmGwcuUF3EBYsjB4bEMeWbXVjmWZbizIeUudEkA'
);

var perfiles=[];

// Auth handled by index.html

// LOAD
async function cargar(){
  var res=await sb.from('perfiles').select('*').order('created_at',{ascending:false});
  if(res.error){console.error(res.error);return;}
  perfiles=res.data||[];
  renderStats();
  poblarFiltros();
  filtrar();
}

function renderStats(){
  document.getElementById('st-total').textContent=perfiles.length;
  document.getElementById('st-jugadores').textContent=new Set(perfiles.map(function(p){return p.nombre;}).filter(Boolean)).size;
  document.getElementById('st-centros').textContent=new Set(perfiles.map(function(p){return p.cft;}).filter(Boolean)).size;
  var vals=perfiles.map(function(p){return p.loehr_autoconfianza;}).filter(function(v){return v!=null;});
  document.getElementById('st-avg').textContent=vals.length?Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length):'—';
}

function poblarFiltros(){
  var sel=document.getElementById('filter-cft');
  var centros=[...new Set(perfiles.map(function(p){return p.cft;}).filter(Boolean))].sort();
  centros.forEach(function(c){
    var o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);
  });
}

function filtrar(){
  var q=document.getElementById('db-search').value.toLowerCase();
  var cft=document.getElementById('filter-cft').value;
  var cat=document.getElementById('filter-cat').value;
  var filtered=perfiles.filter(function(p){
    var matchQ=!q||(p.nombre||'').toLowerCase().includes(q)||(p.cft||'').toLowerCase().includes(q)||(p.temperamento||'').toLowerCase().includes(q);
    var matchCft=!cft||p.cft===cft;
    var matchCat=!cat||p.categoria===cat;
    return matchQ&&matchCft&&matchCat;
  });
  // Keep DB order (updated_at desc) when no search, alphabetical when filtering
  var sorted;
  var q=document.getElementById('db-search').value;
  var cft=document.getElementById('filter-cft').value;
  var cat=document.getElementById('filter-cat').value;
  if(q||cft||cat){
    sorted=filtered.slice().sort(function(a,b){return(a.nombre||'').localeCompare(b.nombre||'','es');});
  } else {
    sorted=filtered; // keep updated_at desc order from DB
  }
  document.getElementById('results-count').textContent=sorted.length+' perfil'+(sorted.length!==1?'es':'')+' encontrado'+(sorted.length!==1?'s':'');
  renderTabla(sorted);
}

function sc(v,max){
  if(v==null)return'<span class="score sc-grey">—</span>';
  var p=v/max;
  var cls=p>=26/30?'sc-green':p>=20/30?'sc-amber':'sc-red';
  return'<span class="score '+cls+'">'+v+'<span style="color:#aaa;font-weight:500;">/'+max+'</span></span>';
}

function fmtDateTime(val){
  if(!val)return'—';
  var d=new Date(val);
  var m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function fmtDate(val){
  if(!val)return'—';
  var pts=val.substring(0,10).split('-');
  var m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return parseInt(pts[2])+' '+m[parseInt(pts[1])-1]+' '+pts[0];
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderTabla(data){
  var tbody=document.getElementById('tbody');
  if(!data||data.length===0){
    tbody.innerHTML='<tr><td colspan="9" class="empty">No se encontraron perfiles con ese criterio.</td></tr>';
    return;
  }
  tbody.innerHTML=data.map(function(p){
    return'<tr>'+
      '<td class="name-cell">'+
        '<button class="name-btn" onclick="toggleMenu(event,''+p.id+'')">'+escHtml(p.nombre||'—')+'</button>'+
        '<div class="action-menu" id="menu-'+p.id+'">'+
          '<button class="action-menu-btn" onclick="irAPerfil(''+p.id+'','ver')">📥 Ver y descargar PDF</button>'+
          '<button class="action-menu-btn" onclick="irAPerfil(''+p.id+'','editar')">✏️ Editar perfil</button>'+
          '<button class="action-menu-btn danger" onclick="eliminar(''+p.id+'')">🗑 Eliminar</button>'+
        '</div>'+
      '</td>'+
      '<td>'+fmtDate(p.fecha_nacimiento)+'</td>'+
      '<td>'+escHtml(p.cft||'—')+'</td>'+
      '<td>'+escHtml(p.temperamento||'—')+'</td>'+
      '<td>'+sc(p.loehr_autoconfianza,30)+'</td>'+
      '<td>'+sc(p.loehr_control_emocional,60)+'</td>'+
      '<td>'+sc(p.loehr_concentracion,60)+'</td>'+
      '<td>'+sc(p.loehr_motivacion,30)+'</td>'+
      '<td style="color:var(--muted);font-size:16px;">'+fmtDate(p.fecha_aplicacion)+'</td>'+
      '<td style="color:var(--blue);font-size:15px;font-weight:700;">'+fmtDateTime(p.updated_at||p.created_at)+'</td>'+
    '</tr>';
  }).join('');
}

// MENUS
function toggleMenu(e,id){
  e.stopPropagation();
  closeAllMenus();
  var m=document.getElementById('menu-'+id);
  if(m)m.classList.add('open');
}
function closeAllMenus(){
  document.querySelectorAll('.action-menu.open').forEach(function(m){m.classList.remove('open');});
}
document.addEventListener('click',closeAllMenus);

// ACTIONS — redirect to index with params
function irAPerfil(id,accion){
  closeAllMenus();
  window.location.href='/?'+accion+'='+id;
}

async function eliminar(id){
  closeAllMenus();
  var rec=perfiles.find(function(p){return p.id===id;});
  var nombre=rec?rec.nombre:'este jugador';
  if(!confirm('¿Eliminar el perfil de '+nombre+'? Esta acción no se puede deshacer.'))return;
  var res=await sb.from('perfiles').delete().eq('id',id);
  if(res.error){toast('Error al eliminar','error');return;}
  toast('Perfil de '+nombre+' eliminado','success');
  cargar();
}

function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(type||'')+' show';
  setTimeout(function(){t.className='toast';},3000);
}

// INIT
// If not authenticated, redirect to login
if(sessionStorage.getItem('tds-auth')==='ok'||localStorage.getItem('tds-auth-persist')==='ok'){
  sessionStorage.setItem('tds-auth','ok');
  cargar();
} else {
  window.location.href='/';
}
</script>
